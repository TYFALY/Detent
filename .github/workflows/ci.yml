name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # FFmpeg is only needed by the integration tests; they skip cleanly when it is absent.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: cargo test --workspace

  bench-smoke:
    name: benches compile + run once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--test` mode executes every benchmark exactly once without measuring.
      - run: cargo bench --workspace -- --test

  native-features:
    name: whisper + onnx adapters compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # whisper-rs builds whisper.cpp with CMake and generates bindings with libclang.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev
      - run: cargo clippy -p detent-indexer --features whisper,onnx --all-targets -- -D warnings

  native-whisper-windows:
    name: whisper adapter compiles (Windows MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The runner ships MSVC, CMake and LLVM (libclang for bindgen).
      - run: cargo clippy -p detent-indexer --features whisper --all-targets -- -D warnings
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin

  native-whisper-windows-gnu:
    name: whisper adapter builds and runs (Windows GNU)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      # Links whisper.cpp through the patched vendor/ crates and runs the test
      # binary. It skips without a model, but a broken link or a missing DLL
      # entry point still fails here.
      - run: cargo +stable-x86_64-pc-windows-gnu test -p detent-indexer --features whisper --test whisper_native
        env:
          CMAKE_GENERATOR: Ninja
          LIBCLANG_PATH: ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin
