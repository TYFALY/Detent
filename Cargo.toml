[workspace]
resolver = "3"
members = [
    "crates/detent-core",
    "crates/detent-indexer",
    "crates/detent-renderer",
    "crates/detent-mcp",
    "crates/detent-cli",
]
exclude = ["vendor"]
default-members = [
    "crates/detent-core",
    "crates/detent-indexer",
    "crates/detent-renderer",
    "crates/detent-mcp",
    "crates/detent-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["TYFALY"]

[workspace.dependencies]
detent-core = { path = "crates/detent-core", version = "0.1.0" }
detent-indexer = { path = "crates/detent-indexer", version = "0.1.0", default-features = false }
detent-renderer = { path = "crates/detent-renderer", version = "0.1.0" }
detent-mcp = { path = "crates/detent-mcp", version = "0.1.0" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
schemars = "1.2"
thiserror = "2.0.18"
anyhow = "1.0.102"
rustfft = "6.4"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
rmcp = { version = "3.10", features = ["server", "macros", "schemars", "transport-io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
base64 = "0.22"
tempfile = "3.27"

# dev
proptest = "1.12"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "plotters"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = false

# whisper-rs 0.16 / whisper-rs-sys 0.15 with fixes for x86_64-pc-windows-gnu
# (see vendor/README.md). Only the CPU and BLAS ggml backends are vendored.
[patch.crates-io]
whisper-rs = { path = "vendor/whisper-rs" }
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }
