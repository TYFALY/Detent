[package]
name = "detent-mcp"
description = "Model Context Protocol (stdio) server exposing detent indexing, EDL solving and rendering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "detent-mcp"
path = "src/main.rs"

[features]
default = []
whisper = ["detent-indexer/whisper"]

[dependencies]
detent-core.workspace = true
detent-indexer = { workspace = true, features = ["dsp", "ffmpeg-cli"] }
detent-renderer.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio.workspace = true
rmcp.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
